      - slug: chinelaria-principal
        nome_conta: "Chinelaria Leilane Neves"
        site_id: MLB
        user_id: "2332812759"  # user_id da conta no ML
        papel: principal              # principal | secundaria | outlet | teste
        observacoes: >
          Modelo "User Products": cada variação tamanho/cor é um item
          separado compartilhando family_name.

  - id: tawaty
    nome: "CASA TAWATY"
    nicho: "Equipamentos agrícolas / motosserras"
    responsavel: "Neto"
    status: ativo
    contas:
      - slug: tawaty-principal
