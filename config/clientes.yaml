# ============================================================
# REGISTRO CENTRAL DE CLIENTES E CONTAS
# ------------------------------------------------------------
# Um cliente pode ter 1 ou N contas de Mercado Livre.
# Este arquivo é a ÚNICA fonte de verdade sobre "quem é quem".
# Nenhuma credencial mora aqui — cada conta tem seu .env isolado.
# ============================================================

clientes:

