# ============================================================
# REGRAS DE ALERTA
# Cada regra pode ser desligada (ativa: false) ou ter o limiar ajustado.
# Regras marcadas 'critico: true' disparam alerta imediato;
# as demais entram só no relatório diário.
#
# ------------------------------------------------------------
# CRITÉRIO DE 'critico', revisto em 02/09/2026
#
# Medido naquele dia: 1.357 alertas críticos em 24 h. Um canal que dispara
# 1.357 vezes por dia não é um canal de alerta — é um canal que se silencia,
# e aí o aviso que importava se perde junto.
#
# A régua passou a ser: crítico é o que exige decisão HOJE e é RARO.
# O que se acompanha em painel — buy box, campanha aberta, anúncio alterado —
# desceu para o resumo diário. Continua sendo coletado e continua aparecendo
# em `cli.py alertas` e nas páginas; só deixou de interromper.
#
# Volume por regra nas 24 h que motivaram a mudança, para comparar depois:
#   perdeu_buy_box 489 · meu_anuncio_mudou 390 · concorrente_cruzou_preco 303
#   promocao_liberada 120 · concorrente_mexeu 52 · anuncio_pausado 2
# ============================================================

regras:

  concorrente_cruzou_preco:
    ativa: true
    # Desceu para o resumo em 02/09/2026, e a razão não é o volume: é que aqui
    # "concorrente mais barato" descreve um ESTADO, não um evento. Nestas contas
    # o preço mediano está de 38% a 51% acima do mais barato da mesma ficha —
    # então o cruzamento é a condição normal, e avisar 279 vezes por dia sobre
    # uma condição normal é ruído por construção.
    #
    # Medido antes de decidir: subir a tolerância de 1% para 5% derrubaria só
    # 9% dos alertas (279 de 308 continuariam passando). O limiar não era o
    # problema. O evento que mereceria interromper é "mudou de patamar", e isso
    # o motor ainda não distingue.
    #
    # Quem precisa da foto de agora tem a página da loja e `cli.py alertas`.
    critico: false
    descricao: >
      Um concorrente VIGIADO ficou mais barato que o anúncio seu com o qual
      ele foi vinculado. Só dispara para anúncios listados em
      contas/<slug>/concorrentes.yaml com o campo 'comparar_com' preenchido —
      comparar com qualquer item da mesma categoria geraria alerta falso em
      produto sob medida.
    # 1% era ruído: ninguém muda preço porque o vizinho ficou R$ 8 mais barato
    # num sofá de R$ 900, e a 1% o mesmo par de anúncios repicava 3,1 vezes por
    # dia. 5% é a diferença que o comprador enxerga na lista.
    tolerancia_percentual: 5.0

  meu_preco_caiu_ou_subiu:
    ativa: true
    critico: false
    descricao: "Seu próprio preço mudou desde a última coleta."
    variacao_minima_percentual: 3.0

  meu_anuncio_mudou:
    ativa: true
    # Desceu para o resumo em 02/09/2026: 390 disparos em 24 h, e a maior parte
    # eram anúncios que o PRÓPRIO time acabara de publicar — a Decoralli subiu
    # cerca de 90 num dia e cada um virou alerta urgente. O resto é o ML mexendo
    # sozinho em promoção e qualidade, que não se resolve na hora.
    #
    # Se um dia interessar ser avisado na hora de alguém mexer na conta sem
    # avisar, a saída não é voltar isto para crítico e sim separar a regra:
    # 'publicaram anúncio novo' e 'alteraram um anúncio existente' são notícias
    # diferentes e hoje compartilham o mesmo nome.
    critico: false
    descricao: >
      Alguma coisa mudou em um anúncio SEU: título, foto de capa, tipo de
      anúncio, frete, modo de envio, categoria, entrada ou saída do catálogo,
      qualidade, promoção, infração — ou o anúncio sumiu da conta.
      Cobre tanto o que o Mercado Livre altera sozinho quanto o que alguém
      com acesso à conta mexe sem te avisar.
    # queda_de_saude NÃO é lida por core/rules.py — conferido em 02/09/2026
    # cruzando as chaves do YAML com o código. Ficava aqui parecendo um limiar
    # que segurava alerta, e não segurava nada. Deixada comentada de propósito:
    # para valer, precisa ser implementada na regra, não reescrita aqui.
    # queda_de_saude: 0.1

  venda_nova:
    ativa: true
    critico: false
    descricao: "Um anúncio vendeu desde a última leitura."

  concorrente_mexeu:
    ativa: true
    critico: true
    descricao: >
      Um concorrente conhecido mudou alguma coisa no anúncio DELE desde a
      rodada anterior: preço, frete grátis, custo do frete, estoque ou
      status. É o alerta que responde "mexeram em alguma coisa?" — chega
      na rodada seguinte à mudança.
    # 2% pegava reajuste de centavo. 5% é mexida que muda a disputa.
    variacao_minima_percentual: 5.0
    avisar_frete: true
    avisar_estoque: true
    # Quando o MESMO vendedor muda a MESMA coisa em vários produtos na mesma
    # rodada, vira uma mensagem só. Concorrente grande reajusta a tabela
    # inteira de uma vez; sem isso chegariam vinte mensagens iguais.
    agrupar_a_partir_de: 4

  estoque_zerado:
    ativa: true
    critico: true
    descricao: "Anúncio ativo ficou com estoque 0."

  estoque_baixo:
    ativa: true
    critico: false
    descricao: "Estoque abaixo do limiar."
    limiar_unidades: 5

  anuncio_pausado:
    ativa: true
    critico: true
    descricao: "Anúncio saiu de 'active' (pausado, fechado ou sob revisão)."

  queda_de_posicao:
    ativa: true
    critico: false
    descricao: "Seu anúncio caiu na busca para uma palavra-chave monitorada."
    queda_minima_posicoes: 3

  perdeu_buy_box:
    ativa: true
    # Desceu para o resumo em 02/09/2026: 489 disparos em 24 h sobre 141 anúncios
    # — 3,5 avisos por anúncio, e o campeão repicou 10 vezes no mesmo dia. Buy box
    # oscila o dia inteiro por natureza; avisar a cada troca não é notícia, é
    # relógio. Quem precisa do estado de agora abre a página da loja.
    #
    # O certo seria manter crítico com um intervalo mínimo entre avisos do MESMO
    # anúncio, como cupom_queimando faz com horas_entre_avisos. O motor ainda não
    # tem isso de forma genérica — enquanto não tiver, o resumo é o lugar honesto.
    critico: false
    descricao: "Você deixou de ser o vencedor do catálogo (buy box)."

  buy_box_no_fio:
    ativa: true
    critico: false
    descricao: >
      Você ainda tem o buy box, mas com pouca folga de preço. Aviso
      antecipado: dá tempo de decidir com calma em vez de reagir depois
      de perder.
    margem_percentual: 3.0

  venda_travada:
    ativa: true
    critico: false
    descricao: "Anúncio que vendia parou de vender no período."
    dias_sem_venda: 7

  reputacao_caiu:
    ativa: true
    critico: true
    descricao: "Cor do termômetro de reputação da conta piorou."

  concorrente_novo_no_topo:
    ativa: true
    critico: false
    descricao: "Apareceu um vendedor novo no top N da palavra-chave."
    top_n: 10

  promocao_liberada:
    ativa: true
    # Desceu para o resumo em 02/09/2026: 120 por dia, e campanha liberada tem
    # prazo de DIAS — cabe na leitura da manhã. O que continua crítico é o
    # dinheiro saindo agora: cupom_queimando e cupom_fura_o_piso.
    critico: false
    descricao: >
      O Mercado Livre liberou uma campanha para um anúncio seu e ela ainda
      não foi aceita. O alerta traz o preço da campanha comparado com o piso
      do anúncio: a pergunta nesse momento não é 'existe promoção?', é 'dá
      para aceitar?'. Depende de custo cadastrado — sem planilha de custo o
      aviso chega, mas sem veredito.
      Só campanha nova entra; as que já estavam abertas não repetem.

  promocao_ativa_fura_o_piso:
    ativa: true
    # Critico junto com os de cupom, e pelo mesmo motivo: nao e' uma decisao
    # que espera a leitura da manha, e' dinheiro saindo agora. A campanha ja
    # esta no ar e cada venda que entrar sai abaixo do combinado.
    critico: true
    descricao: >
      Uma campanha que JA ESTA RODANDO deixa o anuncio abaixo do piso, E SAIR
      DELA RESOLVE. Nao ha o que aceitar aqui: o preco da vitrine ja e' o com
      desconto. Existe porque campanha de conta reaplica sozinha — o anuncio
      sai pela API e o Mercado Livre o devolve sem avisar.
      Fica de fora, de proposito, o caso em que nem a campanha mais cara cabe
      no piso: ali o problema e' o preco de CADASTRO, campanha nenhuma
      resolve, e sao 60 anuncios (medido em 12/09/2026) que mandariam o
      operador mexer no lugar errado. Esse caso e' assunto do relatorio de
      margem. No caso que fica, sao 4 anuncios e cada um tem conserto de um
      comando. Depende de custo cadastrado.
      Um aviso por estado de preco: so repete quando o numero muda.

  frete_do_vendedor_mudou:
    ativa: true
    # O `critico` aqui e decidido no codigo, nao neste arquivo: frete que SOBE
    # em anuncio de frete gratis e dinheiro saindo agora; frete que CAI e boa
    # noticia e nao precisa acordar ninguem. Este valor e so o padrao.
    critico: false
    descricao: >
      Mudou o frete que a LOJA paga (`frete_lista`), nao o que o comprador
      paga. Sao campos diferentes: em frete gratis o do comprador e zero antes
      e depois, entao o alerta antigo era cego justamente onde o frete sai do
      nosso bolso. Em 11/09/2026 o ML passou a absorver 100% da tarifa em 106
      anuncios da Maxi — de ~R$ 107 para R$ 0,00 — e nenhum aviso saiu.
      Dispara a partir de 5% e R$ 2 de diferenca, com os dois lados medidos
      (o frete e lido por rodizio, e comparar com leitura nula ja produziu 76
      alertas falsos). Um aviso por anuncio; volta quando o numero muda.
      Acima de `maximo_individual` anuncios na mesma passada vira UM resumo:
      lote nao e' N problemas, e' um evento do ML, e a acao tambem e' uma so.
    maximo_individual: 8

  vende_no_prejuizo:
    ativa: true
    critico: true
    descricao: >
      O preco de vitrine e menor que custo + frete + comissao + imposto: a
      venda fecha negativa mesmo pedindo 0% de lucro. Diferente de "abaixo do
      piso", que depende da margem-alvo da conta — e a da chinelaria e de 20%
      nunca confirmado com a cliente. Aqui nao ha alvo em disputa: e prejuizo
      em qualquer regua. Medido em 12/09/2026: 29 anuncios da chinelaria, todos
      sem alerta ate agora. Roda na coleta completa, nao a cada ciclo do vigia:
      prejuizo e estado, nao acontecimento.

  frete_arbitrado_pelo_ml:
    ativa: true
    # Critico: e dinheiro saindo por venda, e e invisivel em qualquer outra
    # tela. Quem nao olhar aqui nao olha em lugar nenhum.
    critico: true
    descricao: >
      O Mercado Livre esta cobrando o frete sobre um peso que NAO e o da caixa
      declarada no anuncio — e sem alterar o atributo. O anuncio segue
      mostrando a medida que mandamos, a tela tambem, e a fatura usa outro
      numero. Medido em 12/09/2026: tres anuncios declarando 1.673 g cobrados
      sobre 18.560; o irmao de mesmo SKU que declarou os 23.600 g reais teve a
      declaracao honrada.
      O que dispara a arbitragem e DESCONHECIDO. A hipotese obvia (o ML ignora
      quem declara medida falsa) foi medida em 78 anuncios e morreu: 76 tiveram
      a declaracao aceita, e 33 desses declaram menos que o produto pesa. Isto
      e um detector, nao uma explicacao.
      Contestar exige a medida real conferida. Um aviso por estado; volta a
      avisar quando o numero mudar, inclusive quando voltar ao normal.
    tolerancia_percentual: 1

  cupom_novo:
    ativa: true
    critico: true
    descricao: >
      Apareceu uma campanha de CUPOM na conta que não existia na leitura
      anterior. Cupom é criado no aplicativo em três toques e não altera o
      preço de anúncio nenhum — nada no relatório denuncia que ele existe.
      O aviso traz o teto, quantos usos ele paga e lembra que o Mercado
      Livre não co-participa: o orçamento é 100% do vendedor.

  cupom_queimando:
    ativa: true
    critico: true
    descricao: >
      O orçamento de uma campanha de cupom cruzou uma das faixas de consumo,
      ou queimou muitos usos de uma rodada para a outra. Quando o teto acaba,
      já acabou — este é o único aviso que chega antes.
    faixas_percentuais: [50, 80, 100]
    usos_por_rodada: 10
    horas_entre_avisos: 12

  cupom_fura_o_piso:
    ativa: true
    critico: true
    descricao: >
      Um anúncio que participa da campanha de cupom fica abaixo do piso
      DEPOIS do desconto. Na vitrine ele parece saudável, porque o cupom só
      é aplicado no checkout. Depende de custo cadastrado.

  canibalizacao_interna:
    ativa: true
    critico: false
    descricao: >
      Duas contas da CASA disputando o mesmo comprador. Duas origens:
      (a) mesma palavra-chave na busca, por cliente com coordenar_preco: true;
      (b) por anúncio, quando quem cruzou o preço ou levou a vitrine do
      catálogo é conta nossa — desde 03/09/2026, e sem depender de
      coordenar_preco, porque conta de cliente DIFERENTE também aparece
      (Ênio x Maxi é fábrica e revenda na mesma ficha);
      (c) por anúncio, quando a ficha está com OUTRO anúncio da MESMA conta —
      duplicata dividindo a própria ficha, que não é perder buy box.
      Estes casos saíam antes como concorrente_cruzou_preco e perdeu_buy_box,
      com o conselho "dá para acompanhar" apontando para a loja ao lado.

  concorrente_ganhando_atencao:
    ativa: true
    critico: false
    crescimento_percentual: 50   # quanto as visitas dele precisam subir em 7d
    minimo_visitas: 150          # abaixo disso, o percentual é ruído
    descricao: >
      As visitas de um concorrente na mesma ficha subiram, e as nossas não
      acompanharam. Entrou em 11/09/2026, quando se descobriu que a série
      diária de visitas responde para anúncio de TERCEIRO — `/items/{id}` dá
      403, mas `/items/{id}/visits/time_window` devolve 30 dias.

      A régua é RELATIVA de propósito: compara o crescimento dele com o nosso
      na mesma ficha, com folga de 15 pontos. Categoria inteira subindo é
      sazonalidade, não jogada — e alerta que dispara em sazonalidade ensina o
      operador a ignorar o canal.

      Não é crítico porque não exige decisão hoje: é sinal antecedente. O preço
      é o que chega depois, e para esse já existe concorrente_cruzou_preco.
